name: Deploy Next.js static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
        if: ${{ hashFiles('package-lock.json') != '' }}

      - run: npm install
        if: ${{ hashFiles('package-lock.json') == '' }}

      - name: Crawl unique TRIPO Studio gallery images
        run: node fetch-tripo-assets.mjs

      - name: Verify unique gallery images
        run: |
          test -s public/tripo/studio-gallery/gallery-01.webp
          test -s public/tripo/studio-gallery/gallery-02.webp
          test -s public/tripo/studio-gallery/gallery-03.webp
          test -s public/tripo/studio-gallery/gallery-04.webp
          test -s public/tripo/studio-gallery/gallery-05.webp
          test -s public/tripo/studio-gallery/gallery-06.webp
          test -s public/tripo/studio-gallery/gallery-07.webp
          ls -lh public/tripo/studio-gallery

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /tripo-3d-printing-demo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
